name: Desktop CI and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.38.5"

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Install Simplified Chinese installer messages
        shell: pwsh
        run: |
          $innoRoots = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6",
            "$env:ProgramFiles\Inno Setup 6"
          )
          $innoRoot = $innoRoots |
            Where-Object { Test-Path (Join-Path $_ "ISCC.exe") } |
            Select-Object -First 1
          if (-not $innoRoot) {
            throw "Inno Setup 6 installation directory was not found."
          }

          $languageDir = Join-Path $innoRoot "Languages"
          $languageFile = Join-Path $languageDir "ChineseSimplified.isl"
          $translationUrl = "https://raw.githubusercontent.com/jrsoftware/issrc/c05512b1773ce81bf845c3d2e891f74452cf6f23/Files/Languages/ChineseSimplified.isl"
          $expectedSha256 = "e0b0b350e2245f3c5e65586dfe43d574f6e7f06f2261149aba284954b3fc9a8d"

          New-Item -ItemType Directory -Force -Path $languageDir | Out-Null
          Invoke-WebRequest -Uri $translationUrl -OutFile $languageFile
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $languageFile).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "ChineseSimplified.isl checksum mismatch: $actualSha256"
          }

      - name: Build Windows packages
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: log4app-windows-x64
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macOS ARM64
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          architecture: arm64

      - name: Build macOS application
        run: ./scripts/build-macos.sh

      - name: Package macOS DMG
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml | head -n 1)"
          app_path="build/macos/Build/Products/Release/Log4App.app"
          dmg_dir="dist/macos"
          dmg_path="$dmg_dir/Log4App-$version-macos-arm64.dmg"

          test -n "$version"
          test -d "$app_path"
          mkdir -p "$dmg_dir"
          hdiutil create \
            -volname "Log4App" \
            -srcfolder "$app_path" \
            -ov \
            -format UDZO \
            "$dmg_path"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: log4app-macos-arm64
          path: dist/macos/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            runner: ubuntu-24.04
            artifact_name: log4app-linux-x64

          - name: ARM64
            runner: ubuntu-24.04-arm
            artifact_name: log4app-linux-arm64

    runs-on: ${{ matrix.runner }}

    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive

    timeout-minutes: 60

    steps:
      # ============================================================
      # 1. 安装 Linux 编译依赖
      # ============================================================
      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail

          apt-get update

          apt-get install --yes --no-install-recommends \
            binutils \
            ca-certificates \
            clang \
            lld-10 \
            cmake \
            curl \
            file \
            git \
            jq \
            libblkid-dev \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-9-dev \
            ninja-build \
            pkg-config \
            tar \
            unzip \
            xz-utils \
            zip

      # ============================================================
      # 2. 判断当前 Runner 的真实 CPU 架构
      #
      # 不依赖 matrix.flutter_arch，
      # 防止再次出现 matrix 变量为空的问题。
      # ============================================================
      - name: Detect Linux architecture
        shell: bash
        run: |
          set -euo pipefail

          MACHINE_ARCH="$(uname -m)"

          case "$MACHINE_ARCH" in
            x86_64)
              FLUTTER_ARCH="x64"
              DEB_ARCH="amd64"
              ;;

            aarch64|arm64)
              FLUTTER_ARCH="arm64"
              DEB_ARCH="arm64"
              ;;

            *)
              echo "Unsupported Linux architecture: $MACHINE_ARCH" >&2
              exit 1
              ;;
          esac

          echo "MACHINE_ARCH=$MACHINE_ARCH" >> "$GITHUB_ENV"
          echo "FLUTTER_ARCH=$FLUTTER_ARCH" >> "$GITHUB_ENV"
          echo "DEB_ARCH=$DEB_ARCH" >> "$GITHUB_ENV"

          echo "========================================"
          echo "Linux architecture"
          echo "========================================"
          echo "Machine : $MACHINE_ARCH"
          echo "Flutter : $FLUTTER_ARCH"
          echo "Debian  : $DEB_ARCH"

      # ============================================================
      # 3. Checkout 当前项目
      # ============================================================
      - name: Check out source
        uses: actions/checkout@v6

      # ============================================================
      # 4. x64 Flutter
      #
      # Flutter 3.38.5 官方提供 Linux x64 SDK，
      # 所以 x64 继续使用 flutter-action。
      # ============================================================
      - name: Set up Flutter x64
        if: env.FLUTTER_ARCH == 'x64'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          architecture: x64

      # ============================================================
      # 5. ARM64 Flutter
      #
      # Flutter 3.38.5 没有可供 flutter-action 获取的
      # Linux ARM64 SDK archive。
      #
      # 因此 ARM64 Runner 直接 checkout Flutter 3.38.5 源码，
      # Flutter 自身会按照 aarch64 主机下载 ARM64 Dart SDK。
      # ============================================================
      - name: Set up Flutter ARM64
        if: env.FLUTTER_ARCH == 'arm64'
        shell: bash
        run: |
          set -euo pipefail

          FLUTTER_DIR="/opt/flutter"

          echo "========================================"
          echo "Install Flutter ARM64"
          echo "========================================"

          rm -rf "$FLUTTER_DIR"

          git clone \
            --depth 1 \
            --branch "${FLUTTER_VERSION}" \
            https://github.com/flutter/flutter.git \
            "$FLUTTER_DIR"

          git config --global --add safe.directory "$FLUTTER_DIR"

          echo "FLUTTER_ROOT=$FLUTTER_DIR" >> "$GITHUB_ENV"
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          echo "$FLUTTER_DIR/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"

          echo
          echo "Bootstrapping Flutter..."

          "$FLUTTER_DIR/bin/flutter" --version

      # ============================================================
      # 6. 信任 Flutter SDK
      # ============================================================
      - name: Trust Flutter SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "FLUTTER_ROOT=$FLUTTER_ROOT"

          git config --global --add safe.directory "$FLUTTER_ROOT"

      # ============================================================
      # 7. 验证 Flutter / Dart
      # ============================================================
      - name: Verify Flutter environment
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Flutter root"
          echo "========================================"
          echo "$FLUTTER_ROOT"

          echo
          echo "========================================"
          echo "Flutter"
          echo "========================================"
          command -v flutter
          flutter --version

          echo
          echo "========================================"
          echo "Dart"
          echo "========================================"
          command -v dart
          dart --version

          echo
          echo "========================================"
          echo "Host"
          echo "========================================"
          uname -a

          echo
          echo "MACHINE_ARCH=$MACHINE_ARCH"
          echo "FLUTTER_ARCH=$FLUTTER_ARCH"
          echo "DEB_ARCH=$DEB_ARCH"

      # ============================================================
      # 8. 启用并缓存 Linux Desktop artifacts
      # ============================================================
      - name: Precache Linux artifacts
        shell: bash
        run: |
          set -euo pipefail

          flutter config --enable-linux-desktop
          flutter precache --linux

      # ============================================================
      # 9. 验证 Linux 原生编译工具链
      #
      # clang:
      #   Flutter/CMake C/C++ 编译器
      #
      # lld-10:
      #   Dart native assets 会寻找：
      #   /usr/lib/llvm-10/bin/ld.lld
      # ============================================================
      - name: Verify Linux toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Operating system"
          echo "========================================"
          cat /etc/os-release

          echo
          echo "========================================"
          echo "Architecture"
          echo "========================================"
          uname -m
          dpkg --print-architecture

          echo
          echo "========================================"
          echo "GLIBC"
          echo "========================================"
          ldd --version | head -n 1

          echo
          echo "========================================"
          echo "clang"
          echo "========================================"
          command -v clang
          clang --version

          echo
          echo "========================================"
          echo "clang++"
          echo "========================================"
          command -v clang++
          clang++ --version

          echo
          echo "========================================"
          echo "LLD"
          echo "========================================"

          if [ ! -x /usr/lib/llvm-10/bin/ld.lld ]; then
            echo "/usr/lib/llvm-10/bin/ld.lld not found." >&2
            exit 1
          fi

          /usr/lib/llvm-10/bin/ld.lld --version

          echo
          echo "========================================"
          echo "CMake"
          echo "========================================"
          cmake --version

          echo
          echo "========================================"
          echo "Ninja"
          echo "========================================"
          ninja --version

      # ============================================================
      # 10. Flutter doctor
      # ============================================================
      - name: Flutter doctor
        shell: bash
        run: |
          set -euo pipefail

          flutter doctor -v

      # ============================================================
      # 11. 构建 Linux
      #
      # build-linux.sh 自己根据 uname -m 决定：
      #
      # x86_64
      #   -> build/linux/x64
      #   -> amd64.deb
      #
      # aarch64
      #   -> build/linux/arm64
      #   -> arm64.deb
      # ============================================================
      - name: Build Linux packages
        shell: bash
        env:
          MAX_GLIBC_VERSION: "2.31"
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Build Linux"
          echo "========================================"
          echo "MACHINE_ARCH=$MACHINE_ARCH"
          echo "FLUTTER_ARCH=$FLUTTER_ARCH"
          echo "DEB_ARCH=$DEB_ARCH"

          chmod +x ./scripts/build-linux.sh

          ./scripts/build-linux.sh

      # ============================================================
      # 12. 验证生成的 Linux 包
      #
      # 这里不再使用 matrix.flutter_arch。
      # 全部使用 Detect Linux architecture 步骤产生的环境变量。
      # ============================================================
      - name: Verify Linux packages
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Generated Linux packages"
          echo "========================================"

          find dist/linux -maxdepth 1 -type f -print

          echo
          echo "========================================"
          echo "Expected architecture"
          echo "========================================"

          echo "MACHINE_ARCH=$MACHINE_ARCH"
          echo "FLUTTER_ARCH=$FLUTTER_ARCH"
          echo "DEB_ARCH=$DEB_ARCH"

          case "$FLUTTER_ARCH" in
            x64)
              EXPECTED_ELF_PATTERN="x86-64"
              ;;

            arm64)
              EXPECTED_ELF_PATTERN="ARM aarch64|aarch64"
              ;;

            *)
              echo "Unsupported Flutter architecture: $FLUTTER_ARCH" >&2
              exit 1
              ;;
          esac

          # --------------------------------------------------------
          # 找 DEB
          # --------------------------------------------------------
          DEB_FILE="$(find dist/linux \
            -maxdepth 1 \
            -type f \
            -name "log4app_*_${DEB_ARCH}.deb" \
            -print \
            -quit)"

          if [ -z "$DEB_FILE" ]; then
            echo "Expected DEB package was not generated." >&2
            echo "Expected Debian architecture: $DEB_ARCH" >&2

            echo
            echo "dist/linux contains:"
            find dist/linux -maxdepth 1 -type f -print >&2

            exit 1
          fi

          echo
          echo "========================================"
          echo "DEB package"
          echo "========================================"

          echo "$DEB_FILE"

          ACTUAL_DEB_ARCH="$(dpkg-deb -f "$DEB_FILE" Architecture)"

          echo "Expected : $DEB_ARCH"
          echo "Actual   : $ACTUAL_DEB_ARCH"

          if [ "$ACTUAL_DEB_ARCH" != "$DEB_ARCH" ]; then
            echo "DEB architecture mismatch." >&2
            echo "Expected: $DEB_ARCH" >&2
            echo "Actual:   $ACTUAL_DEB_ARCH" >&2
            exit 1
          fi

          # --------------------------------------------------------
          # 找 Flutter bundle executable
          # --------------------------------------------------------
          BUNDLE_EXECUTABLE="build/linux/${FLUTTER_ARCH}/release/bundle/log4app"

          echo
          echo "========================================"
          echo "Release executable"
          echo "========================================"

          echo "$BUNDLE_EXECUTABLE"

          if [ ! -f "$BUNDLE_EXECUTABLE" ]; then
            echo "Linux executable not found:" >&2
            echo "$BUNDLE_EXECUTABLE" >&2

            echo
            echo "Available Linux build files:" >&2
            find build/linux -maxdepth 5 -type f \
              -name "log4app" \
              -print >&2 || true

            exit 1
          fi

          FILE_INFO="$(file "$BUNDLE_EXECUTABLE")"

          echo "$FILE_INFO"

          if ! echo "$FILE_INFO" | grep -Eq "$EXPECTED_ELF_PATTERN"; then
            echo "Executable architecture mismatch." >&2
            echo "Expected pattern: $EXPECTED_ELF_PATTERN" >&2
            echo "Actual: $FILE_INFO" >&2
            exit 1
          fi

          echo
          echo "========================================"
          echo "Linux package verification PASSED"
          echo "========================================"
          echo "Flutter architecture : $FLUTTER_ARCH"
          echo "Debian architecture  : $DEB_ARCH"
          echo "DEB                   : $DEB_FILE"
          echo "Executable            : $BUNDLE_EXECUTABLE"

      # ============================================================
      # 13. 上传构建结果
      # ============================================================
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/linux/*
          if-no-files-found: error
          retention-days: 14
        name: Build Linux ${{ matrix.name }}

  

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate tag version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml | head -n 1)"
          if [[ "$tag_version" != "$app_version" ]]; then
            echo "Tag version $tag_version does not match pubspec version $app_version." >&2
            exit 1
          fi

      - name: Download platform packages
        uses: actions/download-artifact@v5
        with:
          path: release-assets

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > release-assets/SHA256SUMS

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release-assets -type f -print0)
          if (( ${#files[@]} == 0 )); then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --generate-notes \
              --title "Log4App $GITHUB_REF_NAME"
          fi

  notify-dingtalk:
    name: Notify DingTalk
    if: always()
    needs:
      - build-windows
      - build-macos
      - build-linux
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Check out notification script
        uses: actions/checkout@v6

      - name: Send CI result to DingTalk
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}

        run: python3 .github/scripts/notify_dingtalk.py
