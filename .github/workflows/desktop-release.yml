name: Desktop CI and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.38.5"

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Install Simplified Chinese installer messages
        shell: pwsh
        run: |
          $innoRoots = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6",
            "$env:ProgramFiles\Inno Setup 6"
          )
          $innoRoot = $innoRoots |
            Where-Object { Test-Path (Join-Path $_ "ISCC.exe") } |
            Select-Object -First 1
          if (-not $innoRoot) {
            throw "Inno Setup 6 installation directory was not found."
          }

          $languageDir = Join-Path $innoRoot "Languages"
          $languageFile = Join-Path $languageDir "ChineseSimplified.isl"
          $translationUrl = "https://raw.githubusercontent.com/jrsoftware/issrc/c05512b1773ce81bf845c3d2e891f74452cf6f23/Files/Languages/ChineseSimplified.isl"
          $expectedSha256 = "e0b0b350e2245f3c5e65586dfe43d574f6e7f06f2261149aba284954b3fc9a8d"

          New-Item -ItemType Directory -Force -Path $languageDir | Out-Null
          Invoke-WebRequest -Uri $translationUrl -OutFile $languageFile
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $languageFile).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "ChineseSimplified.isl checksum mismatch: $actualSha256"
          }

      - name: Build Windows packages
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: log4app-windows-x64
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macOS ARM64
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          architecture: arm64

      - name: Build macOS application
        run: ./scripts/build-macos.sh

      - name: Package macOS DMG
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml | head -n 1)"
          app_path="build/macos/Build/Products/Release/Log4App.app"
          dmg_dir="dist/macos"
          dmg_path="$dmg_dir/Log4App-$version-macos-arm64.dmg"

          test -n "$version"
          test -d "$app_path"
          mkdir -p "$dmg_dir"
          hdiutil create \
            -volname "Log4App" \
            -srcfolder "$app_path" \
            -ov \
            -format UDZO \
            "$dmg_path"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: log4app-macos-arm64
          path: dist/macos/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libblkid-dev \
            libgtk-3-dev \
            liblzma-dev \
            ninja-build \
            pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Linux packages
        run: ./scripts/build-linux.sh

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: log4app-linux-x64
          path: dist/linux/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate tag version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml | head -n 1)"
          if [[ "$tag_version" != "$app_version" ]]; then
            echo "Tag version $tag_version does not match pubspec version $app_version." >&2
            exit 1
          fi

      - name: Download platform packages
        uses: actions/download-artifact@v5
        with:
          path: release-assets

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > release-assets/SHA256SUMS

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release-assets -type f -print0)
          if (( ${#files[@]} == 0 )); then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --generate-notes \
              --title "Log4App $GITHUB_REF_NAME"
          fi

  notify-dingtalk:
    name: Notify DingTalk
    if: always()
    needs:
      - build-windows
      - build-macos
      - build-linux
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Check out notification script
        uses: actions/checkout@v6

      - name: Send CI result to DingTalk
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}

        run: python3 .github/scripts/notify_dingtalk.py
