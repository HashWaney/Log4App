name: Desktop CI and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.38.5"

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Install Simplified Chinese installer messages
        shell: pwsh
        run: |
          $innoRoots = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6",
            "$env:ProgramFiles\Inno Setup 6"
          )
          $innoRoot = $innoRoots |
            Where-Object { Test-Path (Join-Path $_ "ISCC.exe") } |
            Select-Object -First 1
          if (-not $innoRoot) {
            throw "Inno Setup 6 installation directory was not found."
          }

          $languageDir = Join-Path $innoRoot "Languages"
          $languageFile = Join-Path $languageDir "ChineseSimplified.isl"
          $translationUrl = "https://raw.githubusercontent.com/jrsoftware/issrc/c05512b1773ce81bf845c3d2e891f74452cf6f23/Files/Languages/ChineseSimplified.isl"
          $expectedSha256 = "e0b0b350e2245f3c5e65586dfe43d574f6e7f06f2261149aba284954b3fc9a8d"

          New-Item -ItemType Directory -Force -Path $languageDir | Out-Null
          Invoke-WebRequest -Uri $translationUrl -OutFile $languageFile
          $actualSha256 = (Get-FileHash -Algorithm SHA256 $languageFile).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "ChineseSimplified.isl checksum mismatch: $actualSha256"
          }

      - name: Build Windows packages
        shell: pwsh
        run: ./scripts/build-windows.ps1

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: log4app-windows-x64
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: Build macOS ARM64
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter ARM64
        shell: bash
        run: |
          set -euo pipefail

          FLUTTER_DIR="$HOME/flutter"

          rm -rf "$FLUTTER_DIR"

          git clone \
            --depth 1 \
            --branch "${FLUTTER_VERSION}" \
            https://github.com/flutter/flutter.git \
            "$FLUTTER_DIR"

          git config --global --add safe.directory "$FLUTTER_DIR"

          echo "FLUTTER_ROOT=$FLUTTER_DIR" >> "$GITHUB_ENV"
          echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
          echo "$FLUTTER_DIR/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"

          "$FLUTTER_DIR/bin/flutter" --version

      - name: Verify Flutter environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Architecture ==="
          uname -m

          echo
          echo "=== Flutter ==="
          flutter --version

          echo
          echo "=== Dart ==="
          dart --version

          echo
          echo "=== Flutter doctor ==="
          flutter doctor -v

      - name: Build macOS application
        run: ./scripts/build-macos.sh

      - name: Package macOS DMG
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml | sed -n '1p')"

          app_path="build/macos/Build/Products/Release/Log4App.app"
          dmg_dir="dist/macos"
          dmg_path="$dmg_dir/Log4App-$version-macos-arm64.dmg"

          test -n "$version"
          test -d "$app_path"

          mkdir -p "$dmg_dir"

          hdiutil create \
            -volname "Log4App" \
            -srcfolder "$app_path" \
            -ov \
            -format UDZO \
            "$dmg_path"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: log4app-macos-arm64
          path: dist/macos/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux ${{ matrix.name }}

    strategy:
        fail-fast: false
        matrix:
          include:
            - name: x64
              runner: ubuntu-24.04
              flutter_arch: x64
              artifact_name: log4app-linux-x64

            - name: ARM64
              runner: ubuntu-24.04-arm
              flutter_arch: arm64
              artifact_name: log4app-linux-arm64

    runs-on: ${{ matrix.runner }}

    container:
        image: ubuntu:20.04
        env:
          DEBIAN_FRONTEND: noninteractive

    timeout-minutes: 60

    steps:
        # ============================================================
        # 1. 安装 Linux 编译依赖
        # ============================================================
        - name: Install Linux build dependencies
          shell: bash
          run: |
            set -euo pipefail

            apt-get update

            apt-get install --yes --no-install-recommends \
              binutils \
              ca-certificates \
              clang \
              lld-10 \
              cmake \
              curl \
              file \
              git \
              jq \
              libblkid-dev \
              libgtk-3-dev \
              liblzma-dev \
              libstdc++-9-dev \
              ninja-build \
              pkg-config \
              tar \
              unzip \
              xz-utils \
              zip

        # ============================================================
        # 2. 检测实际 Linux 架构
        #
        # 同时校验 Runner 实际架构是否和 Matrix 一致。
        # ============================================================
        - name: Detect Linux architecture
          shell: bash
          env:
            EXPECTED_FLUTTER_ARCH: ${{ matrix.flutter_arch }}
          run: |
            set -euo pipefail

            MACHINE_ARCH="$(uname -m)"

            case "$MACHINE_ARCH" in
              x86_64)
                FLUTTER_ARCH="x64"
                DEB_ARCH="amd64"
                ;;

              aarch64|arm64)
                FLUTTER_ARCH="arm64"
                DEB_ARCH="arm64"
                ;;

              *)
                echo "Unsupported Linux architecture: $MACHINE_ARCH" >&2
                exit 1
                ;;
            esac

            echo "========================================"
            echo "Linux architecture"
            echo "========================================"
            echo "Machine  : $MACHINE_ARCH"
            echo "Flutter  : $FLUTTER_ARCH"
            echo "Debian   : $DEB_ARCH"
            echo "Expected : $EXPECTED_FLUTTER_ARCH"

            if [ "$FLUTTER_ARCH" != "$EXPECTED_FLUTTER_ARCH" ]; then
              echo "Runner architecture mismatch." >&2
              echo "Expected: $EXPECTED_FLUTTER_ARCH" >&2
              echo "Actual:   $FLUTTER_ARCH" >&2
              exit 1
            fi

            echo "MACHINE_ARCH=$MACHINE_ARCH" >> "$GITHUB_ENV"
            echo "FLUTTER_ARCH=$FLUTTER_ARCH" >> "$GITHUB_ENV"
            echo "DEB_ARCH=$DEB_ARCH" >> "$GITHUB_ENV"

        # ============================================================
        # 3. 验证 Linux 编译工具链
        # ============================================================
        - name: Verify Linux toolchain
          shell: bash
          run: |
            set -euo pipefail

            echo "=== PATH ==="
            echo "$PATH"

            echo
            echo "=== Architecture ==="
            uname -m
            dpkg --print-architecture

            echo
            echo "=== GLIBC ==="
            ldd --version 2>&1 | sed -n '1p'

            echo
            echo "=== clang ==="
            command -v clang
            ls -l "$(command -v clang)"
            clang --version

            echo
            echo "=== clang++ ==="
            command -v clang++
            ls -l "$(command -v clang++)"
            clang++ --version

            echo
            echo "=== linker ==="
            test -x /usr/lib/llvm-10/bin/ld.lld
            /usr/lib/llvm-10/bin/ld.lld --version

            echo
            echo "=== stdc++ ==="
            ldconfig -p | grep libstdc++ || true

            echo
            echo "=== cmake ==="
            cmake --version

            echo
            echo "=== ninja ==="
            ninja --version

        # ============================================================
        # 4. Checkout 项目
        # ============================================================
        - name: Check out source
          uses: actions/checkout@v6

        # ============================================================
        # 5. x64 Flutter
        #
        # Flutter 3.38.5 Linux x64 可以正常通过 flutter-action 安装。
        # ============================================================
        - name: Set up Flutter x64
          if: matrix.flutter_arch == 'x64'
          uses: subosito/flutter-action@v2
          with:
            flutter-version: ${{ env.FLUTTER_VERSION }}
            channel: stable
            cache: true
            architecture: x64

        # ============================================================
        # 6. ARM64 Flutter
        #
        # Flutter 3.38.5 没有供 flutter-action 使用的
        # Linux ARM64 release archive。
        #
        # 因此直接 checkout Flutter 3.38.5 源码。
        # Flutter 启动时会根据 aarch64 主机拉取 ARM64 Dart SDK。
        # ============================================================
        - name: Set up Flutter ARM64
          if: matrix.flutter_arch == 'arm64'
          shell: bash
          run: |
            set -euo pipefail

            FLUTTER_DIR="/opt/flutter"

            echo "========================================"
            echo "Install Flutter ${FLUTTER_VERSION} ARM64"
            echo "========================================"

            rm -rf "$FLUTTER_DIR"

            git clone \
              --depth 1 \
              --branch "${FLUTTER_VERSION}" \
              https://github.com/flutter/flutter.git \
              "$FLUTTER_DIR"

            git config --global --add safe.directory "$FLUTTER_DIR"

            echo "FLUTTER_ROOT=$FLUTTER_DIR" >> "$GITHUB_ENV"
            echo "$FLUTTER_DIR/bin" >> "$GITHUB_PATH"
            echo "$FLUTTER_DIR/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"

            echo
            echo "Bootstrapping Flutter ARM64..."

            "$FLUTTER_DIR/bin/flutter" --version

        # ============================================================
        # 7. Trust Flutter SDK
        # ============================================================
        - name: Trust Flutter SDK checkout in container
          shell: bash
          run: |
            set -euo pipefail

            echo "FLUTTER_ROOT=$FLUTTER_ROOT"

            git config --global --add safe.directory "$FLUTTER_ROOT"

        # ============================================================
        # 8. 验证 Flutter / Dart
        # ============================================================
        - name: Verify Flutter environment
          shell: bash
          run: |
            set -euo pipefail

            echo "========================================"
            echo "Architecture"
            echo "========================================"
            echo "MACHINE_ARCH=$MACHINE_ARCH"
            echo "FLUTTER_ARCH=$FLUTTER_ARCH"
            echo "DEB_ARCH=$DEB_ARCH"

            echo
            echo "========================================"
            echo "Flutter"
            echo "========================================"
            command -v flutter
            flutter --version

            echo
            echo "========================================"
            echo "Dart"
            echo "========================================"
            command -v dart
            dart --version

        # ============================================================
        # 9. Linux Desktop artifacts
        # ============================================================
        - name: Precache Linux artifacts
          shell: bash
          run: |
            set -euo pipefail

            flutter config --enable-linux-desktop
            flutter precache --linux

        # ============================================================
        # 10. Flutter doctor
        # ============================================================
        - name: Flutter doctor
          shell: bash
          run: |
            set -euo pipefail

            flutter doctor -v

        # ============================================================
        # 11. 构建 Linux
        #
        # build-linux.sh 根据 uname -m 自动产生：
        #
        # x86_64:
        #   build/linux/x64
        #   log4app_xxx_amd64.deb
        #
        # ARM64:
        #   build/linux/arm64
        #   log4app_xxx_arm64.deb
        # ============================================================
        - name: Build Linux packages
          shell: bash
          env:
            MAX_GLIBC_VERSION: "2.31"
            EXPECTED_FLUTTER_ARCH: ${{ matrix.flutter_arch }}
          run: |
            set -euo pipefail

            echo "========================================"
            echo "Build Linux"
            echo "========================================"
            echo "MACHINE_ARCH=$MACHINE_ARCH"
            echo "FLUTTER_ARCH=$FLUTTER_ARCH"
            echo "DEB_ARCH=$DEB_ARCH"
            echo "EXPECTED_FLUTTER_ARCH=$EXPECTED_FLUTTER_ARCH"

            chmod +x ./scripts/build-linux.sh

            ./scripts/build-linux.sh

        # ============================================================
        # 12. 验证生成的 Linux 包
        #
        # 这里不直接使用 matrix.flutter_arch 拼 build 路径，
        # 而使用 Detect Linux architecture 产生的环境变量。
        # ============================================================
        - name: Verify Linux packages
          shell: bash
          run: |
            set -euo pipefail

            echo "========================================"
            echo "Generated Linux packages"
            echo "========================================"

            find dist/linux -maxdepth 1 -type f -print

            echo
            echo "========================================"
            echo "Expected architecture"
            echo "========================================"

            echo "MACHINE_ARCH=$MACHINE_ARCH"
            echo "FLUTTER_ARCH=$FLUTTER_ARCH"
            echo "DEB_ARCH=$DEB_ARCH"

            case "$FLUTTER_ARCH" in
              x64)
                EXPECTED_ELF_PATTERN="x86-64"
                ;;

              arm64)
                EXPECTED_ELF_PATTERN="ARM aarch64|aarch64"
                ;;

              *)
                echo "Unsupported Flutter architecture: $FLUTTER_ARCH" >&2
                exit 1
                ;;
            esac

            # --------------------------------------------------------
            # 验证 DEB
            # --------------------------------------------------------
            DEB_FILE="$(find dist/linux \
              -maxdepth 1 \
              -type f \
              -name "log4app_*_${DEB_ARCH}.deb" \
              -print \
              -quit)"

            if [ -z "$DEB_FILE" ]; then
              echo "Expected DEB package was not generated." >&2
              echo "Expected Debian architecture: $DEB_ARCH" >&2

              echo
              echo "dist/linux contains:"
              find dist/linux -maxdepth 1 -type f -print >&2

              exit 1
            fi

            echo
            echo "========================================"
            echo "DEB package"
            echo "========================================"

            echo "$DEB_FILE"

            ACTUAL_DEB_ARCH="$(dpkg-deb -f "$DEB_FILE" Architecture)"

            echo "Expected : $DEB_ARCH"
            echo "Actual   : $ACTUAL_DEB_ARCH"

            if [ "$ACTUAL_DEB_ARCH" != "$DEB_ARCH" ]; then
              echo "DEB architecture mismatch." >&2
              echo "Expected: $DEB_ARCH" >&2
              echo "Actual:   $ACTUAL_DEB_ARCH" >&2
              exit 1
            fi

            # --------------------------------------------------------
            # 验证最终 ELF
            # --------------------------------------------------------
            BUNDLE_EXECUTABLE="build/linux/${FLUTTER_ARCH}/release/bundle/log4app"

            echo
            echo "========================================"
            echo "Release executable"
            echo "========================================"

            echo "$BUNDLE_EXECUTABLE"

            if [ ! -f "$BUNDLE_EXECUTABLE" ]; then
              echo "Linux executable not found:" >&2
              echo "$BUNDLE_EXECUTABLE" >&2

              echo
              echo "Available Linux executables:" >&2

              find build/linux \
                -maxdepth 6 \
                -type f \
                -name "log4app" \
                -print >&2 || true

              exit 1
            fi

            FILE_INFO="$(file "$BUNDLE_EXECUTABLE")"

            echo "$FILE_INFO"

            if ! echo "$FILE_INFO" | grep -Eq "$EXPECTED_ELF_PATTERN"; then
              echo "Executable architecture mismatch." >&2
              echo "Expected pattern: $EXPECTED_ELF_PATTERN" >&2
              echo "Actual: $FILE_INFO" >&2
              exit 1
            fi

            echo
            echo "========================================"
            echo "Linux package verification PASSED"
            echo "========================================"
            echo "Flutter architecture : $FLUTTER_ARCH"
            echo "Debian architecture  : $DEB_ARCH"
            echo "DEB                   : $DEB_FILE"
            echo "Executable            : $BUNDLE_EXECUTABLE"

        # ============================================================
        # 13. 上传 Linux 安装包
        # ============================================================
        - name: Upload Linux packages
          uses: actions/upload-artifact@v4
          with:
            name: ${{ matrix.artifact_name }}
            path: dist/linux/*
            if-no-files-found: error
            retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate tag version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml | head -n 1)"
          if [[ "$tag_version" != "$app_version" ]]; then
            echo "Tag version $tag_version does not match pubspec version $app_version." >&2
            exit 1
          fi

      - name: Download platform packages
        uses: actions/download-artifact@v5
        with:
          path: release-assets

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > release-assets/SHA256SUMS

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release-assets -type f -print0)
          if (( ${#files[@]} == 0 )); then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --generate-notes \
              --title "Log4App $GITHUB_REF_NAME"
          fi

  notify-dingtalk:
    name: Notify DingTalk
    if: always()
    needs:
      - build-windows
      - build-macos
      - build-linux
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Check out notification script
        uses: actions/checkout@v6

      - name: Send CI result to DingTalk
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          LINUX_RESULT: ${{ needs.build-linux.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}

        run: python3 .github/scripts/notify_dingtalk.py
