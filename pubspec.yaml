name: log4app
description: Cross-platform LAN log collector for apps and devices.
publish_to: 'none'
version: 2.9.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  mime: ^2.0.0
  package_info_plus: ^10.2.1
  path: ^1.9.0
  path_provider: ^2.1.4
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-VF.ttf
